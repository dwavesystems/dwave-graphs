version: 2.1

orbs:
  win: circleci/windows@5.0
  codecov: codecov/codecov@3

jobs:
  test-linux:
    parameters:
      dependency-versions:
        type: string
      python-version:
        type: string

    docker:
      - image: python:<< parameters.python-version >>

    steps:
      - checkout

      - run: &create-venv-install-deps
          name: Create virtual environment and install dependencies
          command: |
            python -m venv env
            . env/bin/activate
            pip install --upgrade pip
            pip install --group dev --group test

      - run:
          name: Override dependencies
          command: |
            . env/bin/activate
            pip install --upgrade << parameters.dependency-versions >>

      - run: &run-tests
          name: Run unittests
          command: |
            . env/bin/activate
            coverage run -m unittest
            coverage xml

      - codecov/upload: &upload-python-code-coverage
          file: coverage.xml

  test-osx:
    parameters:
      python-version:
        type: string
      xcode:
        type: string
        default: "16.4.0"

    macos:
      xcode: << parameters.xcode >>

    steps:
      - checkout

      - restore_cache: &restore-cache-pyenv
          key: &brew-pyenv-cache-key v1-brew-pyenv-{{ .Environment.CIRCLE_JOB }}-xcode-<< parameters.xcode >>

      - run:
          name: Install pyenv
          environment:
            HOMEBREW_NO_ASK: "1"
          command: |
            brew update
            brew install pyenv

      - run:
          name: Install python
          command: |
            pyenv install << parameters.python-version>> -s

      - save_cache: &save-cache-pyenv
          key: *brew-pyenv-cache-key
          paths:
            - /Users/distiller/Library/Caches/Homebrew
            - /usr/local/Homebrew
            - ~/.pyenv

      - run:
          name: Create virtualenv and install dependencies
          command: |
            eval "$(pyenv init --path)"
            pyenv local << parameters.python-version >>
            python -m venv env
            . env/bin/activate
            python --version
            pip install --upgrade pip
            pip install --group dev --group test

      - run: *run-tests

  test-win:
    parameters:
      python-version:
        type: string

    executor:
      name: win/default

    steps:
      - checkout

      - run:
          name: Install python and create virtualenv
          shell: bash -eo pipefail
          command: |
            # resolve python MAJOR.MINOR version to latest MAJOR.MINOR.PATCH version available on NuGet
            full_version=$(
              curl -s 'https://azuresearch-usnc.nuget.org/query?q=python' \
              | jq -r '.data[] | select(.id == "python") .versions[] | .version' \
              | awk -F. -v ver='<< parameters.python-version >>' \
                  'index($0, ver".") == 1 && $3 >= m { m = $3; v = $0 } END { print v }'
            )
            nuget install python -Version "$full_version" -ExcludeVersion
            python/tools/python -V
            python/tools/python -m venv env

      - run:
          name: Install dependencies
          command: |
            env\Scripts\activate.ps1
            python --version
            python -m pip install --upgrade pip
            pip install --group dev --group test

      - run:
          name: Run unittests
          command: |
            env\Scripts\activate.ps1
            python -m unittest

  test-docs:
    docker:
      - image: python:3.12

    steps:
      - checkout

      - run: *create-venv-install-deps

      - run:
          name: Install docs dependencies
          command: |
            . env/bin/activate
            pip install --group docs

      - run:
          name: build docs
          command: |
            . env/bin/activate
            make -C docs/ html

      - store_artifacts:
          path: ./docs/build/html

      - run:
          name: doctest
          command: |
            . env/bin/activate
            make -C docs/ doctest

      - run:
          name: linkcheck
          command: |
            . env/bin/activate
            make -C docs/ linkcheck

  build-dist:
    docker:
      - image: python:3.12

    steps:
      - checkout

      - run: *create-venv-install-deps

      - run:
          name: Install build deps
          command: env/bin/pip install build twine

      - run: &build-package
          name: Build package
          command: env/bin/python -m build

      - run:
          name: Check package
          command: env/bin/twine check ./dist/*

      - store_artifacts:
          path: ./dist

      - persist_to_workspace:
          root: ./dist
          paths: .

  pypi-deploy:
    docker:
      - image: python:3.12

    steps:
      - attach_workspace:
          at: ./dist

      - run:
          name: Install package from sdist
          command: |
            python -m venv env
            . env/bin/activate
            pip install dist/dwave?graphs*.tar.gz

      - run:
          name: Verify version matches tag
          command: |
            . env/bin/activate
            [[ "$(pip show dwave-graphs 2>/dev/null | grep Version)" == "Version: $CIRCLE_TAG" ]]

      - run:
          name: Upload package to PyPI
          command: |
            . env/bin/activate
            pip install twine
            twine upload -u "$PYPI_USERNAME" -p "$PYPI_PASSWORD" --skip-existing ./dist/*

workflows:
  test:
    jobs:
      - test-linux:
          matrix:
            parameters:
              python-version: &python-versions ["3.11", "3.12", "3.13", "3.14"]
              dependency-versions: [&dependencies-oldest "dimod==0.12.22 networkx==3.2 numpy==2",
                                    &dependencies-latest "dimod networkx numpy",
                                    ]

      - test-osx:
          matrix:
            parameters:
              python-version: *python-versions

      - test-win:
          matrix:
            parameters:
              python-version: *python-versions

      - build-dist
      - test-docs

  deploy:
    jobs:
      - build-dist:
          filters: &on-tag
            tags:
              only: /^[0-9]+(\.[0-9]+)*((\.dev|rc)([0-9]+)?)?$/
            branches:
              ignore: /.*/

      - pypi-deploy:
          requires:
            - build-dist
          filters: *on-tag
